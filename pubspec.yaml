name: dastyor
description: "Dastyor — omuzgoron uchun AI yordamchi: konspekt, test, prezentatsiya va lektsiya bir necha soniyada."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # Secure JWT / refresh-token storage
  flutter_secure_storage: ^9.2.2

  # Local prefs — locale choice, onboarding-seen flag
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # App-wide typeface (matches the design mockups)
  google_fonts: ^6.2.1

  # Avatar photo + "book" source document (.pdf/.docx/.txt) pickers
  image_picker: ^1.1.2
  file_picker: ^11.0.2

  # Opens the admin's WhatsApp chat directly (wa.me) from every
  # "top up balance" contact card instead of just showing a copyable
  # number — see widgets/contact_row.dart.
  url_launcher: ^6.3.1

  # Local notification when a long-running "Majmua" (multi-day bundle)
  # finishes generating in the background — see CurriculumWatchService.
  flutter_local_notifications: ^18.0.1

  # In-app PDF preview — lets a teacher see exactly how many pages a
  # generated material/curriculum will be, and how it's laid out, before
  # downloading it. See features/materials/pdf_preview_screen.dart.
  path_provider: ^2.1.5
  flutter_pdfview: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # The App Store rejects icons with an alpha channel; the source has one
  # because it is generated with transparency for every other target.
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

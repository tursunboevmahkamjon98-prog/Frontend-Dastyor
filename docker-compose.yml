# Dastyor stack: Postgres, backend, web app, and Telegram bot.

# Setup: copy backend/.env.example to backend/.env and configure secrets.
# Start: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dastyor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` published to the host on purpose РІР‚вЂќ only `backend` needs
    # to reach Postgres, and it does so over the compose network by
    # service name (db:5432), never through the host's own network stack.
    # Publish 5432:5432 here only if you need psql from the host itself.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # backend/.env's own DATABASE_URL says "localhost" (a dev machine
      # with Postgres installed directly on it) РІР‚вЂќ inside this network
      # that has to be the `db` service's name instead. User/password/db
      # name below must match the `db` service above (or your own external
      # Postgres, in which case override DATABASE_URL entirely instead).
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/dastyor_db
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/dastyor_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Avatars/generated-image uploads survive a container recreation РІР‚вЂќ
      # without this named volume every redeploy would silently orphan
      # every teacher's avatar and every lesson illustration on disk
      # while the DB rows still point at paths that no longer exist.
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8586}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at BUILD time (see frontend/
        # Dockerfile's own comment) РІР‚вЂќ "/api" makes the browser call this
        # same frontend origin, which next.config.ts's rewrites then
        # forward server-side to BACKEND_ORIGIN below. Change this only
        # if the browser should call the backend directly instead (then
        # BACKEND_ORIGIN's host must also be in the backend's
        # CORS_ORIGINS, or every request fails in the browser alone).
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      # Runtime (not build-time) РІР‚вЂќ read when the container starts, so
      # this is the one line to change to point an already-built image at
      # a different backend. "backend" is the service name above; Docker's
      # embedded DNS resolves it on the compose network, "localhost"
      # inside this container would mean the frontend container itself.
      BACKEND_ORIGIN: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The Telegram payment bot. Same image as `backend` (it imports
  # app.models / app.telegram.*), different entrypoint: a long-polling
  # worker instead of uvicorn.
  #
  # Starts automatically with `docker compose up -d --build`, same as
  # the other three services РІР‚вЂќ no separate profile flag. This was
  # behind a COMPOSE PROFILE until 2026-10-24, requiring a second,
  # explicit `docker compose --profile telegram up -d --build
  # telegram-bot` plus a hand-created backend/.env.telegram on the
  # server. That assumed shell access to the server to run the extra
  # command and write the extra file; the only deploy path actually
  # available is git pull plus the one default compose command. Bot tokens
  # belong in the server-local ignored backend/.env. If a future deploy
  # path CAN write a second file to the server, backend/.env.telegram
  # (gitignored) still works and overrides .env for whatever it sets РІР‚вЂќ
  # see .env.telegram.example.
  #
  # Why its own container rather than a task inside the API: the API runs
  # --workers 1 (see backend/Dockerfile's comment) and a poll loop in
  # that worker would compete with request handling; and the bot crashing
  # must not take the API with it.
  #
  # Exactly one replica. Two pollers would both call getUpdates, and
  # Telegram hands each update to whoever asks first РІР‚вЂќ so the duplicate
  # would not double-credit (the status compare-and-swap in
  # app/telegram/service.py stops that) but it would double-message every
  # teacher. Do not scale this service. (tests/test_telegram_startup.py
  # also guards the one case that would quietly create a second poller:
  # TELEGRAM_ADMIN_BOT_TOKEN set equal to TELEGRAM_BOT_TOKEN.)
  telegram-bot:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Same reasoning as `backend` above: .env says localhost, which
      # inside this network has to be the db service's name.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/dastyor_db
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/dastyor_db
    depends_on:
      db:
        condition: service_healthy
    # No `ports:`. The bot only makes outbound calls to
    # api.telegram.org; nothing needs to reach it, and publishing a port
    # would be pure attack surface.
    command: ["python", "-m", "app.telegram.bot"]

volumes:
  postgres_data:
  backend_uploads:

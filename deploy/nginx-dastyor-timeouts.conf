# /etc/nginx/conf.d/dastyor-timeouts.conf
#
# Copy this file to that path on the server, then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# WHY THIS FILE EXISTS, and why it is a conf.d drop-in rather than an
# edit to sites-available/dastyor: certbot owns that file (it rewrites
# it on every renewal to keep the SSL block current), so hand-edits
# there are liable to be clobbered. Everything below is valid at nginx's
# http{} level, and Ubuntu's stock nginx.conf already does
# `include /etc/nginx/conf.d/*.conf;` inside http{} — so these apply to
# the site's proxied locations without touching certbot's file at all.
#
# THE BUG THIS FIXES: nginx's proxy_read_timeout defaults to 60s. A
# presentation is generated by POST /api/materials/generate, which does
# not return a single byte until the whole deck is finished — and the AI
# client alone allows 180s per attempt with up to 3 attempts
# (ai_service.py), on top of a queue wait of up to AI_QUEUE_TIMEOUT_SECONDS
# (config.py, 120s). Any of those crossing 60s makes nginx abandon the
# upstream and return its own 504 HTML page. That page has no JSON
# "detail" field, so the frontend's extractError (lib/api.ts) falls
# through to its last resort and the teacher is told "Ошибка сервера" —
# a message the backend itself never sends. Locally there is no nginx in
# front of uvicorn, which is exactly why this only ever reproduced in
# production.
#
# Konspekts kept working through the same outage because they go through
# /generate-konspekt-stream instead: an SSE response whose first bytes
# arrive almost immediately and keep arriving, so the read timeout never
# fires. Presentations have no streaming equivalent.
proxy_connect_timeout 30s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

# Books/sources uploaded for generation. Was set on location /api/ in
# sites-available/dastyor; repeated here so the limit survives a certbot
# rewrite of that file.
client_max_body_size 20M;

# Deliberately NOT setting `proxy_buffering off` globally — it would
# make nginx stream the Next.js site's responses too, for no gain. The
# one endpoint that needs unbuffered output already asks for it per
# response: routers/materials.py sets X-Accel-Buffering: no on the SSE
# stream, which nginx honours on its own.
